# Force Python provider + use virtualenv to avoid externally-managed-environment error
providers = ["python"]

[phases.install]
cmds = ["python -m venv /opt/venv", "/opt/venv/bin/pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && /opt/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port $PORT"
